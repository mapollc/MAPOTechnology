    <meta property="og:title" content="Hiking, Mountain Bike, and Gravel & Road Bike Trail Maps - Map of Trails">
    <meta property="og:description"
        content="Find trails to hike, mountain bike, ski, and snowmobile in Oregon, Idaho, Utah, and California using Map of Trails, a recreation mapping app.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Map of Trails">

    <meta property="og:image" content="//mapotechnology.com/assets/images/mapotrails_logo.png">
    <meta property="twitter:card" content="summary_large_image">

    <meta property="twitter:title" content="Hiking, Mountain Bike, and Gravel & Road Bike Trail Maps - Map of Trails">
    <meta property="twitter:description"
        content="Find trails to hike, mountain bike, ski, and snowmobile in Oregon, Idaho, Utah, and California using Map of Trails, a recreation mapping app.">
    <meta property="twitter:image" content="//mapotechnology.com/assets/images/mapotrails_logo.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#00385c">
    <meta name="robots" content="index,follow">
<link rel="apple-touch-icon" href="//mapotechnology.com/assets/images/mt-apple-touch-icon.png">
    <link rel="icon" sizes="any" href="//mapotechnology.com/assets/images/mt-favicon.png">
    <link rel="shortcut icon" href="//mapotechnology.com/assets/images/mt-favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/app.css">
    <link rel="stylesheet" href="./css/supp.css">
    <link rel="preload" href="//fonts.googleapis.com/css2?family=Roboto:wght@300..700&display=swap" as="style"

    <noscript>
        <link rel="stylesheet" href="//fonts.googleapis.com/css2?family=Roboto:wght@300..700&display=swap">
    </noscript>

</head>

<body>
    <main>
        <nav id="app-nav">
            <div class="nav-wrapper">
                <div class="logo">
                    <a href="#" onclick="return false">
                        <img src="//mapotechnology.com/assets/images/mapotrails_icon_transparent.png">
                    </a>
                </div>
                <span id="dd-close" data-action="dropdown-nav" class="far fa-xmark"></span>
                <ul>
                    <li id="account" class="ttip" data-action="account" data-tooltip='{"text":"Login/Create Account","dir":"right"}'>
                        <i class="fas fa-user-circle"></i><span>Login</span>
                    </li>
                    <li id="basemap" class="ttip" data-action="basemaps" data-tooltip='{"text":"Basemaps","dir":"left"}'>
                        <i class="far fa-grid"></i><span>Maps</span>
                    </li>
                    <li id="layer-group" class="ttip" data-action="layers" data-tooltip='{"text":"Layers","dir":"left"}'>
                        <i class="far fa-layer-group"></i><span>Layers</span>
                    </li>
                    <!--<li id="custom" class="ttip" data-tooltip='{"text":"Your saved content","dir":"left"}'>
                        <i class="fas fa-folders"></i><span>Content</span>
                    </li>
                    <li id="import" class="ttip" data-tooltip='{"text":"Upload a file","dir":"left"}'>
                        <i class="far fa-file-import"></i><span>Upload</span>
                    </li>-->
                    <li id="save" class="ttip" data-action="sync" data-tooltip='{"text":"Sync map settings","dir":"left"}'>
                        <i class="far fa-cloud-arrow-up"></i><span>Sync</span>
                    </li>
                    <li class="ttip" data-tooltip='{"text":"About Map-o-Trails","dir":"left"}' onclick="window.location.href='https://www.mapotrails.com/about'">
                        <i class="fas fa-circle-info"></i><span>About</span>
                    </li>
                    <li class="ttip" data-tooltip='{"text":"Donate","dir":"left"}' onclick="window.location.href='https://buy.stripe.com/6oEdTx7PFdAJ8YU3cc'">
                        <i class="fas fa-circle-dollar-to-slot"></i><span>Donate</span>
                    </li>
                    <li class="ttip" data-action="logout" data-tooltip='{"text":"Logout","dir":"left"}'>
                        <i class="far fa-right-from-bracket"></i><span>Logout</span>
                    </li>
                </ul>
                <i class="fas fa-chevron-left" title="Toggle navigation" id="close-navbar" data-action="close-navbar"
                    data-open="true"></i>
            </div>
        </nav>

        <div class="app-wrapper">
            <div id="map"></div>
            <div class="bd"></div>
            <div class="loading">
                <img src="//mapotechnology.com/assets/images/mapotrails_logo.png" fetchpriority="high"
                    alt="Map of Trails logo" title="Map of Trails" style="height:50px">
                <div class="s"></div><span>Preparing map...</span>
            </div>

            <div class="filter-controls">
                <span id="menuIcon" data-action="dropdown-nav" class="far fa-bars"></span>
                <div class="search control">
                    <span class="far fa-magnifying-glass"></span>
                    <input type="text" id="q" autocomplete="off" disabled placeholder="Search trails, cities, or coordinates">
                    <span id="clearSearch" data-action="clear-search" class="far fa-xmark"></span>
                    <ul id="search-results" class="control">
                        <li class="standby" style="gap:.5em"><i class="fa-duotone fa-spinner-third"></i><span>Searching...</span></li>
                    </ul>
                </div>
            </div>
        </div>

        <div id="impact">
            <header>
                <h2 class="title"></h2>
                <div class="impactClose" data-action="close-impact"><i class="fat fa-times"></i></div>
            </header>
            <div class="wrapper"></div>
        </div>
    </main>

    <script async src="//kit.fontawesome.com/b7a6b6c2b4.js" crossorigin="anonymous"></script>
</body>

</html>
